name: Frontend CI

on:
  push:
    paths:
      - 'services/web/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'services/web/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: ./services/web

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Linting
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Unit Tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api"
